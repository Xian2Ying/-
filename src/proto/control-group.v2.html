<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>词勇者 · 对照组（四级+六级 真实词库 · 四难度基线）</title>
<style>
:root{--bg:#15121f;--bg2:#1e1a2e;--panel:#262038;--gold:#f4c75b;--green:#5dc26a;--red:#e0573f;--txt:#f3eefb;--dim:#a89fc0;--tint:#2a4a7a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:radial-gradient(circle at 50% 0%,#241d39,#15121f 70%);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;justify-content:center;transition:background .4s;}
#app{width:100%;max-width:430px;padding:16px;overflow:hidden;}
.banner{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:700;}
.banner .e{font-size:22px;}
.banner .sub{font-weight:400;color:#fff;opacity:.85;font-size:13px;margin-left:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--dim);}
.stage{background:var(--panel);border:2px solid #3a3358;border-radius:16px;padding:18px;margin:8px 0;min-height:300px;}
/* 对照组：刻意无怪动画/连击/音效/HP —— 仅平铺做题，作为 roguelike 的对照（同四难度同词库，单变量=有无肉鸽机制） */
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--dim);margin-bottom:8px;}
.tag.boss{background:#3a1d1d;color:var(--red);font-weight:700;}
.qword{text-align:center;font-size:32px;font-weight:700;letter-spacing:1px;margin:4px 0;}
.phon{text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{background:var(--bg2);border:2px solid #3a3358;border-radius:12px;padding:13px 8px;font-size:14px;color:var(--txt);cursor:pointer;text-align:center;transition:border-color .15s;}
.opt:active{transform:scale(.98);}
.opt.correct{border-color:var(--green);background:#1d3a24;}
.opt.wrong{border-color:var(--red);background:#3a1d1d;}
.opt.dim{opacity:.45;pointer-events:none;}
.opt .mark{font-weight:700;margin-left:4px;}
.mark.ok{color:var(--green);}.mark.no{color:var(--red);}
.speak{display:block;margin:0 auto 8px;background:var(--bg2);border:2px solid #3a3358;border-radius:20px;color:var(--txt);padding:7px 14px;font-size:13px;cursor:pointer;}
.feedback{text-align:center;min-height:20px;font-size:14px;margin:8px 0;font-weight:600;}
.feedback.ok{color:var(--green);}.feedback.bad{color:var(--red);}
.next{width:100%;background:var(--gold);color:#2a1d05;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;}
.next:disabled{opacity:.4;}
.overlay{background:var(--panel);border:2px solid #3a3358;border-radius:16px;padding:22px;margin:8px 0;text-align:center;}
.overlay h2{margin:6px 0 10px;font-size:20px;}
.overlay p{color:var(--dim);font-size:13px;line-height:1.6;margin:6px 0;}
.tierbtn{width:100%;background:var(--bg2);border:2px solid #3a3358;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;color:var(--txt);text-align:left;}
.tierbtn b{color:var(--gold);}
</style>
</head>

const TIERS=[
 {key:'easy',name:'简单',sub:'放学后·练习室',levels:10,emoji:'🌸',tint:'#3a4a7a',bossEvery:0},
 {key:'normal',name:'普通',sub:'少女乐队·邦多利 × GBC',levels:25,emoji:'🎸',tint:'#7a3a6e',bossEvery:8},
 {key:'hard',name:'困难',sub:'少女歌剧·Revue Starlight',levels:40,emoji:'🎭',tint:'#a83232',bossEvery:5},
 {key:'hell',name:'地狱',sub:'終幕·最終公演',levels:60,emoji:'💀',tint:'#3a0d0d',bossEvery:10,
  stages:['I','II','III','IV'],stageFloors:[5,10,20,25]}
];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function poolForFloor(t,floor){
 if(t.key!=='hell') return POOLS[t.key];
 let cum=0; for(let i=0;i<t.stages.length;i++){cum+=t.stageFloors[i]; if(floor<=cum) return POOLS.hell[t.stages[i]];}
 return POOLS.hell.IV;
}
function stageLabel(t,floor){
 if(t.key!=='hell') return '';
 let cum=0; for(let i=0;i<t.stages.length;i++){cum+=t.stageFloors[i]; if(floor<=cum) return '地狱'+t.stages[i];}
 return '地狱IV';
}
function buildOptions(w,pool){
 const wrongs=[]; const others=pool.filter(x=>x.mean!==w.mean); const sh=shuffle(others.slice());
 for(const o of sh){ if(wrongs.length<3) wrongs.push(o.mean); }
 return shuffle([w.mean,...wrongs]);
}

function unlockVoice(){if(audioUnlocked)return;audioUnlocked=true;try{if(!sharedAudio)sharedAudio=new Audio();sharedAudio.onplaying=function(){voiceFail=0;voiceResult="ok";};sharedAudio.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";var p=sharedAudio.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function voiceSrc(text,stage){if(stage===0)return "audio/"+encodeURIComponent(text)+".mp3"+SHARE_Q;if(stage===1)return "https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(text)+"&type=2";return "";}
function voiceFor(text){var a=voiceCache[text];if(a)return a;a=new Audio();a.preload="auto";a.dataset.stage="0";a.onplaying=function(){voiceFail=0;voiceResult="ok";};a.onerror=function(){var st=parseInt(a.dataset.stage||"0",10);if(st<2){var nx=voiceSrc(text,st+1);a.dataset.stage=String(st+1);if(nx){a.src=nx;return;}}voiceFail++;voiceResult="fail";speakNative(text);};a.src=voiceSrc(text,0);voiceCache[text]=a;return a;}
function speakNative(text){if(!window.speechSynthesis)return false;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1;u.volume=1;window.speechSynthesis.speak(u);return true;}catch(e){return false;}}
function playShared(text){try{if(!sharedAudio)return false;sharedAudio.src=voiceSrc(text,0);var p=sharedAudio.play();if(p&&p.catch)p.catch(function(){voiceResult="fail";speakNative(text);});return true;}catch(e){return false;}}
function speak(text){if(!text)return;unlockVoice();if(voiceFail<3){var a;try{a=voiceFor(text);}catch(e){a=null;}if(a){for(var k in voiceCache){if(k!==text){try{voiceCache[k].pause();voiceCache[k].currentTime=0;}catch(e){}}}try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}try{a.pause();a.currentTime=0;}catch(e){}var p=a.play();if(p&&p.catch){p.catch(function(err){if(err&&err.name==="AbortError")return;if(playShared(text))return;voiceFail++;voiceResult="fail";speakNative(text);});}return;}}speakNative(text);}
["pointerdown","touchstart","click"].forEach(function(ev){document.addEventListener(ev,function(){unlockVoice();ensureAudio();},{once:true,passive:true});});

let tierIdx=0, level=1, answered=false, curMean="", usedWords=new Set();
function applyTheme(t){document.documentElement.style.setProperty('--tint',t.tint);}
function showBanner(t){$("banner").innerHTML='<span class="e">'+t.emoji+'</span><span>'+t.name+' 难度</span><span class="sub">'+t.sub+'</span>';}
function tierMenu(){
  applyTheme(TIERS[0]); showBanner({emoji:'📋',name:'对照组',sub:'平铺基线'});
  const btns=TIERS.map((t,i)=>'<button class="tierbtn" data-i="'+i+'"><b>'+t.emoji+' '+t.name+'</b> · '+t.levels+'关 · '+t.sub+'</button>').join('');
  $("stage").innerHTML='<div class="overlay"><div style="font-size:40px">📋</div><h2>选择难度</h2><p>简单(10)→普通(25)→困难(40)→地狱(60)<br>（对照组：平铺做题，无战斗机制）</p>'+btns+'</div>';
  document.querySelectorAll('.tierbtn').forEach(b=>b.onclick=()=>startTier(parseInt(b.dataset.i)));
}
function startTier(i){tierIdx=i;level=1;usedWords.clear();render();}
function render(){
  const t=TIERS[tierIdx]; applyTheme(t); showBanner(t);
  const isBoss=(t.bossEvery>0 && level%t.bossEvery===0);
  const pool=poolForFloor(t,level);
  const avail=pool.filter(x=>!usedWords.has(x.en));
  const pick=(avail.length?avail:pool)[Math.floor(Math.random()*(avail.length?avail.length:pool.length))];
  usedWords.add(pick.en);
  let w=pick;
  curWordEn=w.en; curMean=w.mean; answered=false;
  const sl=stageLabel(t,level);
  const stage=$("stage"); stage.className="";
  stage.innerHTML=
    '<div class="tag'+(isBoss?' boss':'')+'">'+(isBoss?'⚠ BOSS 关 · 第 '+level+' 关':'第 '+level+' 关')+(sl?' · '+sl:'')+'</div>'+
    '<button class="speak" id="speak">🔊 听发音</button>'+
    '<div class="qword">'+esc(w.en)+'</div><div class="phon">'+esc(w.phon)+'</div>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="feedback" id="fb"></div>'+
    '<button class="next" id="next" disabled>下一关 →</button>';
  const optsBox=$("opts");
  const opts=buildOptions(w,pool);
  opts.forEach(tt=>{const b=document.createElement("button");b.className="opt";b.textContent=tt;b.onclick=()=>choose(b);optsBox.appendChild(b);});
  $("speak").onclick=()=>speak(w.en);
  $("next").onclick=advance;
}
let curWordEn="";
function choose(btn){
  if(answered)return;answered=true;
  const all=[...document.querySelectorAll(".opt")];
  if(btn.textContent===curMean){
    btn.classList.add("correct");const m=document.createElement("span");m.className="mark ok";m.textContent="✓";btn.appendChild(m);
    all.forEach(b=>{if(b!==btn)b.classList.add("dim");});
    $("fb").textContent="正确";$("fb").className="feedback ok";
  }else{
    btn.classList.add("wrong");const m=document.createElement("span");m.className="mark no";m.textContent="✗";btn.appendChild(m);
    all.forEach(b=>{if(b.textContent===curMean){b.classList.add("correct");const c=document.createElement("span");c.className="mark ok";c.textContent="✓";b.appendChild(c);}});
    $("fb").textContent="错误，正确答案已标出";$("fb").className="feedback bad";
  }
  $("next").disabled=false;
}
function advance(){
  const t=TIERS[tierIdx];
  if(level<t.levels){level++;render();}
  else if(tierIdx<TIERS.length-1){
    const nt=TIERS[tierIdx+1];
    $("stage").innerHTML='<div class="overlay"><div style="font-size:40px">✅</div><h2>通关 '+t.name+' 难度！</h2><p>难度进阶 → <b style="color:var(--gold)">'+nt.name+'（'+nt.levels+'关 · '+nt.sub+'）</b></p><button class="next" onclick="startTier('+(tierIdx+1)+')">进入下一难度 →</button></div>';
  }else{
    $("stage").innerHTML='<div class="overlay"><div style="font-size:48px">🎉</div><h2>全部通关！</h2><p>你打穿了 简单 → 普通 → 困难 → 地狱 四档<br>单词全部收服 🏆</p><button class="next" onclick="tierMenu()">从头再战</button></div>';
  }
}
tierMenu();
</script>
</body>
