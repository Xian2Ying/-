<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>词勇者 · Word Quest</title>
<style>
:root{--bg:#15121f;--gold:#f4c75b;--txt:#f3eefb;--dim:#a89fc0;--blue:#60a5fa;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,#241d39,#15121f 72%);color:var(--txt);
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:22px 16px 48px}
.wrap{max-width:520px;width:100%;text-align:center}
.hero{font-size:52px;line-height:1;margin-bottom:10px}
h1{font-size:28px;margin:0 0 8px;letter-spacing:2px}
.sub{color:var(--dim);font-size:15px;line-height:1.9;margin-bottom:26px}
.play{display:block;background:var(--gold);color:#241f0b;font-weight:800;font-size:19px;
 border-radius:14px;padding:18px;text-decoration:none;letter-spacing:1px;box-shadow:0 6px 0 #8a6d18}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #8a6d18}
.ai-go{display:block;margin-top:14px;background:rgba(96,165,250,.14);color:#bfdbfe;font-weight:700;font-size:15px;
 border:1px solid var(--blue);border-radius:14px;padding:14px;text-decoration:none;letter-spacing:1px}
.ai-go:active{transform:translateY(2px)}
.points{text-align:left;margin:30px 0 0;font-size:14px;line-height:2.1;color:var(--txt);list-style:none;padding:0}
.points b{color:var(--gold)}
.points .ai b{color:#bfdbfe}
.hell{margin-top:22px;font-size:13px;color:var(--dim)}
.hell a{color:var(--dim)}
.meta{margin-top:22px;color:var(--dim);font-size:12px;opacity:.8}
</style></head><body>
<div class="wrap">
  <div class="hero">⚔️</div>
  <h1>词勇者</h1>
  <div class="sub">Word Quest · 打怪就是背词<br>100 个四级高频词 · AI 学习助手陪你进化</div>
  <a class="play" href="game.v3.html">▶ 开始游戏</a>
  <a class="ai-go" href="game.v3.html?ai=1">🤖 直接问 AI 学习助手</a>
  <ul class="points">
    <li><b>打怪背词</b>　每关一只词怪，答对掉血、全对击杀</li>
    <li><b>例句卡</b>　每题答完都弹出「释义 + 中英例句」</li>
    <li><b>敢开口</b>　口语镇跟引导员对话练发音</li>
    <li class="ai"><b>🤖 AI 学习助手</b>　智能分析薄弱词 · 动态调整计划 · 对话学词</li>
  </ul>
  <div class="hell">进阶玩法：<a href="roguelike.v2.html?demo=1">地狱模式（背词 × 肉鸽 · 演示版）</a></div>
  <div class="meta">手机 / 电脑浏览器打开即玩 · 进度存在本机 · v1.3</div>
</div>
<script>
(function(){
  var q=(location.search||"").match(/[?&]sharecode=[^&]*/);
  if(!q) return;
  var v=q[0].replace(/^[?&]/,"");
  Array.prototype.forEach.call(document.querySelectorAll("a[href]"),function(a){
    var h=a.getAttribute("href")||"";
    if(!h||/^(https?:|#|mailto:|javascript:|data:)/.test(h)) return;
    if(h.indexOf("sharecode=")!==-1) return;
    a.setAttribute("href", h+(h.indexOf("?")===-1?"?":"&")+v);
  });
})();
</script>
</body></html>
