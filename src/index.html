<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>词勇者 · Word Quest</title>
<style>
  :root{
    --bg:#15121f; --bg2:#1e1a2e; --panel:#262038; --line:#0d0b14; --edge:#5b5182;
    --ink:#f4f1e8; --dim:#a49bb8;
    --gold:#f5c542; --green:#4ade80; --red:#f87171; --purple:#8b7cf6; --blue:#60a5fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(circle at 20% 0%, #2b2445 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241f3a 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:"SF Mono",Menlo,Consolas,"Courier New","PingFang SC","Microsoft YaHei",monospace;
    font-size:15px;line-height:1.6;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:430px;min-height:100vh;padding:14px 14px 28px;position:relative}
  .screen{display:none;animation:fade .18s ease-out}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 像素外框 */
  .panel{
    background:var(--panel);border:3px solid var(--edge);
    box-shadow:0 4px 0 var(--line), inset 0 0 0 1px rgba(255,255,255,.05);
    padding:14px;margin-bottom:14px;
  }
  .btn{
    display:block;width:100%;font-family:inherit;font-size:15px;
    padding:14px 12px;margin-bottom:10px;cursor:pointer;
    background:var(--purple);color:#fff;border:3px solid var(--edge);
    box-shadow:0 4px 0 var(--line);border-radius:0;font-weight:bold;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
  .btn.gold{background:var(--gold);color:#241f0b}
  .btn.ghost{background:transparent;color:var(--dim);border-color:rgba(244,241,232,.25);box-shadow:none;font-weight:normal}
  .btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:0 6px 0 0}
  .row{display:flex;gap:8px}
  .row .btn{margin-bottom:0}

  h1{font-size:26px;margin:6px 0 2px;letter-spacing:2px}
  h2{font-size:16px;margin:0 0 10px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .center{text-align:center}
  .dim{color:var(--dim)}
  .tiny{font-size:11.5px}

  /* 顶部状态条 */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg2);border:3px solid var(--edge);padding:8px 10px;margin-bottom:14px;
  }
  .topbar b{color:var(--gold)}
  .back{cursor:pointer;color:var(--dim);font-size:13px;border:none;background:none;font-family:inherit;padding:0}

  /* 地图 */
  .node{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:3px solid var(--edge);
    padding:14px;margin-bottom:12px;cursor:pointer;position:relative;
  }
  .node:active{transform:translateY(2px)}
  .node .icon{
    width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;
    font-size:22px;border:3px solid var(--edge);background:var(--bg2);
  }
  .node .nm{font-size:15px;font-weight:bold}
  .node .st{color:var(--gold);font-size:13px;letter-spacing:2px}
  .node.locked{opacity:.45;cursor:not-allowed}
  .node.clear .icon{background:#20402c}
  .link{width:3px;height:14px;background:rgba(244,241,232,.18);margin:-10px 0 -10px 30px}

  /* 答题 */
  .prog{height:12px;background:var(--bg2);border:3px solid var(--edge);margin-bottom:12px}
  .prog i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:10px}
  .combo{color:var(--gold);font-weight:bold}
  .word{font-size:30px;margin:14px 0 2px;letter-spacing:1px}
  .phon{color:var(--dim);font-size:13px;margin-bottom:4px}
  .ask{font-size:14px;color:var(--dim);margin-bottom:14px}
  .opt{
    display:block;width:100%;text-align:left;font-family:inherit;font-size:15px;
    padding:14px 12px;margin-bottom:9px;cursor:pointer;
    background:var(--bg2);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--line);
  }
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .opt.right{background:#20402c;border-color:var(--green);color:#c9f7dc}
  .opt.wrong{background:#4a1f24;border-color:var(--red);color:#ffd4d4}
  .opt .k{display:inline-block;width:22px;color:var(--dim)}
  .spell{
    width:100%;font-family:inherit;font-size:20px;text-align:center;letter-spacing:2px;
    padding:14px;background:var(--bg);color:var(--gold);border:3px solid var(--edge);margin-bottom:12px;
  }
  .blanks{font-size:26px;letter-spacing:6px;color:var(--gold);margin:14px 0}

  /* 结算 */
  .stars{font-size:40px;letter-spacing:8px;margin:10px 0 4px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .nums div{background:var(--bg2);border:2px solid var(--edge);padding:10px 4px;text-align:center}
  .nums b{display:block;font-size:19px;color:var(--gold)}
  .nums span{font-size:11px;color:var(--dim)}
  .npc{display:flex;gap:10px;background:var(--bg2);border:3px solid var(--edge);padding:12px;margin-top:6px}
  .npc .ava{width:44px;height:44px;flex:0 0 44px;background:#3b2f5e;border:3px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:22px}

  /* 错题本 */
  .mw{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dotted rgba(244,241,232,.18)}
  .mw:last-child{border-bottom:none}
  .mw .l b{display:block;font-size:15px}
  .mw .l span{font-size:12px;color:var(--dim)}
  .mw .r{display:flex;gap:6px;align-items:center}
  .chip{font-size:11px;background:#4a1f24;color:#ffd4d4;border:2px solid var(--edge);padding:1px 6px}

  /* PC 端 */
  @media (min-width:1024px){
    #app{max-width:900px;padding:22px}
    .panel{padding:20px}
    .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .opts .opt{margin-bottom:0}
    .nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .link{display:none}
    .word{font-size:38px}
    .btn{font-size:16px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section class="screen on" id="s-home">
    <div class="center" style="padding:34px 0 20px">
      <div style="font-size:52px">⚔️</div>
      <h1>词勇者</h1>
      <div class="sub">Word Quest · 打怪就是背词</div>
      <div class="panel center tiny" style="text-align:left">
        这片大陆被<b style="color:var(--gold)">遗忘咒</b>笼罩，<br>
        只有念对单词，才能击退单词怪。
      </div>
      <button class="btn gold" id="btn-start">开始冒险</button>
      <button class="btn ghost" id="btn-go-mistake">我的错题本</button>
      <button class="btn ghost" id="btn-go-set">设置</button>
      <div class="tiny dim" style="margin-top:16px">进度存在本机 · 断网也能玩</div>
    </div>
  </section>

  <!-- 地图 -->
  <section class="screen" id="s-map">
    <div class="topbar">
      <div>Lv.<b id="tb-lv">1</b> · <span id="tb-xp">0</span> XP</div>
      <div>🪙 <b id="tb-coin">0</b></div>
    </div>
    <h2>冒险地图</h2>
    <div class="nodes" id="nodes"></div>
    <div class="panel">
      <h2>其他地方</h2>
      <button class="btn ghost sm" id="btn-mistake">📕 错题本</button>
      <button class="btn ghost sm" id="btn-npc">💬 口语镇</button>
      <button class="btn ghost sm" id="btn-set">⚙️ 设置</button>
    </div>
    <div class="tiny dim center" id="map-tip"></div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <button class="back" id="btn-quit">✕ 退出</button>
      <div>🪙 <b id="q-coin">0</b> <span class="combo" id="q-combo"></span></div>
    </div>
    <div class="prog"><i id="q-prog"></i></div>
    <div class="qmeta"><span id="q-idx">第 1/10 题</span><span id="q-type"></span></div>
    <div class="panel" id="q-body"></div>
  </section>

  <!-- 结算 -->
  <section class="screen" id="s-result">
    <div class="panel center">
      <div class="tiny dim" id="r-title">第 1 关 · 通关</div>
      <div class="stars" id="r-stars">★★★</div>
      <div class="nums">
        <div><b id="r-rate">100%</b><span>正确率</span></div>
        <div><b id="r-coin">0</b><span>获得金币</span></div>
        <div><b id="r-time">0:00</b><span>用时</span></div>
      </div>
      <div class="npc">
        <div class="ava">🧙</div>
        <div class="tiny" id="r-say" style="text-align:left"></div>
      </div>
    </div>
    <button class="btn gold" id="btn-again">再来一关</button>
    <button class="btn" id="btn-back-map">回到地图</button>
    <button class="btn ghost" id="btn-mistake2">看看这次错的词</button>
    <div class="tiny dim center" id="r-wrong" style="margin-top:10px"></div>
  </section>

  <!-- 错题本 -->
  <section class="screen" id="s-mistake">
    <div class="topbar">
      <button class="back" id="btn-back1">← 返回</button>
      <div id="m-count">错题 0</div>
    </div>
    <div class="panel" id="m-list"></div>
    <button class="btn gold" id="btn-practice-all">一键重练（最多 10 个）</button>
    <div class="tiny dim center" style="margin-top:8px">连续答对 2 次，这个词就毕业啦</div>
  </section>

  <!-- 设置 -->
  <section class="screen" id="s-set">
    <div class="topbar">
      <button class="back" id="btn-back2">← 返回</button>
      <div>设置</div>
    </div>
    <div class="panel">
      <h2>音效</h2>
      <button class="btn sm" id="btn-sfx">🔊 开</button>
      <h2 style="margin-top:16px">发音语速</h2>
      <button class="btn sm" id="btn-rate">正常 1.0x</button>
      <h2 style="margin-top:16px">数据</h2>
      <button class="btn ghost" id="btn-clear">清空全部进度</button>
    </div>
    <div class="tiny dim center">词勇者 v0.1 · 词库 100 词</div>
  </section>

</div>

  if(actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol){
  if(!save.settings.sfx) return;
  ensureAudio(); if(!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.07, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
var SFX = {
  right: function(){ beep(660,.08); setTimeout(function(){beep(990,.10);},80); },
  wrong: function(){ beep(180,.22,"sawtooth",.05); },
  clear: function(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,.14);}, i*110); }); },
  tap:   function(){ beep(440,.05,"triangle",.04); }
};

/* ============ 发音 ============ */
function speak(text){
  if(!window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = save.settings.ttsRate || 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 屏幕切换 ============ */
var SCREENS = ["home","map","quiz","result","mistake","set"];
function show(name){
  SCREENS.forEach(function(s){
    document.getElementById("s-"+s).classList.toggle("on", s === name);
  });
  if(location.hash.slice(1) !== name){ try{ history.replaceState(null,"","#"+name); }catch(e){} }
  window.scrollTo(0,0);
}
function $(id){ return document.getElementById(id); }

/* ============ 地图 ============ */
function unlocked(level){
  if(level === 1) return true;
  return (save.progress[level-1] && save.progress[level-1].stars >= 1);
}
function renderMap(){
  $("tb-lv").textContent = save.profile.level;
  $("tb-xp").textContent = save.profile.xp;
  $("tb-coin").textContent = save.profile.coins;
  var box = $("nodes"); box.innerHTML = "";
  [1,2,3].forEach(function(lv){
    if(lv > 1){ var lk = document.createElement("div"); lk.className = "link"; box.appendChild(lk); }
    var p = save.progress[lv] || {stars:0};
    var open = unlocked(lv);
    var d = document.createElement("div");
    d.className = "node" + (open ? "" : " locked") + (p.stars >= 1 ? " clear" : "");
    var star = p.stars > 0 ? "★".repeat(p.stars) + "☆".repeat(3-p.stars) : "未通关";
    d.innerHTML =
      '<div class="icon">' + LEVEL_ICON[lv] + '</div>' +
      '<div><div class="nm">第 ' + lv + ' 关 · ' + LEVEL_NAME[lv] + '</div>' +
      '<div class="st">' + (open ? star : "🔒 先通过第 " + (lv-1) + " 关") + '</div></div>';
    if(open) d.onclick = function(){ SFX.tap(); startLevel(lv); };
    else d.onclick = function(){ SFX.wrong(); $("map-tip").textContent = "先通过第 " + (lv-1) + " 关才能解锁哦"; };
    box.appendChild(d);
  });
  var total = Object.keys(save.words).length;
  $("map-tip").textContent = "已接触 " + total + " / 100 词 · 错题 " + save.mistakes.length + " 个";
}

/* ============ 出题 ============ */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function poolOf(level){ return WORDS.filter(function(w){ return w.level === level; }); }

function buildQuestions(level){
  var pool = poolOf(level).slice();
  var wrongIds = save.mistakes.filter(function(m){
    return pool.some(function(w){ return w.id === m.wordId; });
  }).map(function(m){ return m.wordId; });

  var picked = [];
  if(wrongIds.length){                       // 复习题优先：错过的词先来
    var wid = wrongIds[0];
    var w = pool.filter(function(x){ return x.id === wid; })[0];
    if(w) picked.push(w);
  }
  var rest = shuffle(pool.filter(function(x){ return picked.indexOf(x) < 0; }));
  while(picked.length < QSIZE && rest.length) picked.push(rest.pop());

  var pattern = ["T1","T2","T3","T1","T2","T3","T1","T2","T3"];
  var qs = picked.slice(0,9).map(function(w,i){ return makeQ(w, pattern[i] || "T1", level); });
  if(picked[9]) qs.push(makeQ(picked[9], "T1", level));   // 第 10 题：复习/补位
  return qs;
}
function makeQ(w, type, level){
  var q = {type:type, word:w};
  if(type === "T1"){                          // 看词选义：中文选项
    var others = shuffle(poolOf(level).filter(function(x){ return x.id !== w.id; })).slice(0,3);
    q.options = shuffle([w.zh].concat(others.map(function(x){ return x.zh; })));
    q.answer = w.zh;
  } else if(type === "T2"){                   // 听音选词：干扰项
    var ds = (w.distractors || []).slice(0,3);
    while(ds.length < 3){ ds.push("—"); }
    q.options = shuffle([w.en].concat(ds));
    q.answer = w.en;
  } else {                                    // 拼写填空
    q.answer = w.en;
  }
  return q;
}

/* ============ 答题流程 ============ */
var run = null;
function startLevel(level){
  run = {
    level: level, qs: buildQuestions(level), i: 0, right: 0, combo: 0, gained: 0,
    startAt: Date.now(), wrongIds: [], locked: false
  };
  show("quiz"); renderQ();
}
function startCustom(list, title){            // 错题重练
  if(!list.length) return;
  var qs = shuffle(list.slice(0,10)).map(function(w,i){
    return makeQ(w, ["T1","T2","T3"][i % 3], w.level);
  });
  run = {level:0, title:title||"错题重练", qs:qs, i:0, right:0, combo:0, gained:0,
         startAt:Date.now(), wrongIds:[], locked:false};
  show("quiz"); renderQ();
}
function renderQ(){
  var q = run.qs[run.i];
  $("q-idx").textContent = "第 " + (run.i+1) + "/" + run.qs.length + " 题";
  $("q-type").textContent = q.type === "T1" ? "看词选义" : (q.type === "T2" ? "听音选词" : "拼写填空");
  $("q-prog").style.width = (run.i / run.qs.length * 100) + "%";
  $("q-coin").textContent = save.profile.coins;
  $("q-combo").textContent = run.combo >= 2 ? "🔥 " + run.combo + " 连对" : "";
  var body = $("q-body");
  run.locked = false;

  if(q.type === "T3"){
    var blanks = q.word.en.charAt(0) + " " + "_ ".repeat(q.word.en.length - 1).trim();
    body.innerHTML =
      '<div class="ask">根据中文释义拼写单词</div>' +
      '<div class="word" style="font-size:18px">' + q.word.zh + '</div>' +
      '<div class="blanks">' + blanks + '</div>' +
      '<input class="spell" id="sp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入完整单词">' +
      '<div class="row"><button class="btn" id="ok" style="margin:0">确认</button>' +
      '<button class="btn ghost" id="spk" style="margin:0">🔊 听一遍</button></div>';
    $("spk").onclick = function(){ speak(q.word.en); };
    var submit = function(){
      if(run.locked) return;
      var v = ($("sp").value || "").trim().toLowerCase();
      if(!v) return;
      judge(v === q.word.en.toLowerCase(), v);
    };
    $("ok").onclick = submit;
    $("sp").onkeydown = function(e){ if(e.key === "Enter") submit(); };
    setTimeout(function(){ try{ $("sp").focus(); }catch(e){} }, 60);
  } else {
    var head = q.type === "T1"
      ? '<div class="word">' + q.word.en + '</div><div class="phon">' + q.word.phonetic + '</div><div class="ask">选出正确的中文释义</div>'
      : '<div class="word" style="font-size:22px">🔊 听发音，选单词</div><div class="ask">点喇叭可以再听一遍</div>';
    body.innerHTML = head + '<div class="opts" id="opts"></div>' +
      (q.type === "T2" ? '<button class="btn ghost" id="spk2" style="margin-top:12px">🔊 再听一遍</button>' : '');
    var box = $("opts");
    q.options.forEach(function(op, idx){
      var b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = '<span class="k">' + (idx+1) + '</span>' + op;
      b.onclick = function(){ if(!run.locked) judge(op === q.answer, op, b); };
      box.appendChild(b);
    });
    if(q.type === "T2"){ $("spk2").onclick = function(){ speak(q.word.en); }; setTimeout(function(){ speak(q.word.en); }, 120); }
  }
}
function judge(ok, chosen, btn){
  run.locked = true;
  var q = run.qs[run.i], w = q.word;
  var rec = save.words[w.id] || {right:0,wrong:0,stage:0,dueAt:0};

  if(ok){
    run.right++; run.combo++;
    var gain = 10 + Math.min((run.combo-1)*2, 10);
    run.gained += gain; save.profile.coins += gain;
    save.profile.xp += 5;
    rec.right++; rec.stage = Math.min(4, rec.stage + 1);
    SFX.right();
    var mi = save.mistakes.findIndex(function(m){ return m.wordId === w.id; });
    if(mi >= 0){
      save.mistakes[mi].streakRight = (save.mistakes[mi].streakRight || 0) + 1;
      if(save.mistakes[mi].streakRight >= 2) save.mistakes.splice(mi,1);
    }
  } else {
    run.combo = 0; run.wrongIds.push(w.id);
    rec.wrong++; rec.stage = 0;
    SFX.wrong();
    var m = save.mistakes.find(function(x){ return x.wordId === w.id; });
    if(m){ m.wrongCount++; m.streakRight = 0; m.lastWrongAt = Date.now(); }
    else save.mistakes.unshift({wordId:w.id, wrongCount:1, streakRight:0, lastWrongAt:Date.now()});
    if(q.type === "T3"){
      var tip = document.createElement("div");
      tip.className = "tiny"; tip.style.color = "var(--gold)";
      tip.style.marginTop = "8px";
      tip.textContent = "正确拼写：" + w.en;
      $("q-body").appendChild(tip);
    }
  }
  save.words[w.id] = rec;
  var lvl = Math.floor(save.profile.xp / 100) + 1;
  if(lvl > save.profile.level){ save.profile.level = lvl; }
  Store.save();

  // 即时视觉反馈
  if(q.type !== "T3"){
    Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"), function(b){
      var t = b.textContent.replace(/^\d/, "").trim();
      if(t === q.answer) b.classList.add("right");
      else if(b === btn) b.classList.add("wrong");
    });
  } else if(btn !== undefined){
    var b2 = $("ok");
    if(b2) b2.style.background = ok ? "#20402c" : "#4a1f24";
  }

  setTimeout(function(){
    run.i++;
    if(run.i >= run.qs.length) finish();
    else renderQ();
  }, q.type === "T3" ? 1100 : 850);
}
function finish(){
  var n = run.qs.length, rate = Math.round(run.right / n * 100);
  var stars = rate === 100 ? 3 : (rate >= 80 ? 2 : (rate >= 60 ? 1 : 0));
  var sec = Math.round((Date.now() - run.startAt) / 1000);

  if(run.level > 0){
    if(stars >= 1){
      save.profile.xp += 50;
      var p = save.progress[run.level];
      p.stars = Math.max(p.stars, stars);
      p.bestRate = Math.max(p.bestRate, rate);
      if(!p.clearedAt) p.clearedAt = new Date().toISOString();
      SFX.clear();
    } else { SFX.wrong(); }
    var lvl = Math.floor(save.profile.xp / 100) + 1;
    save.profile.level = Math.max(save.profile.level, lvl);
  } else { if(run.right > 0) SFX.clear(); }
  Store.save();

  $("r-title").textContent = (run.title || ("第 " + run.level + " 关")) + (stars >= 1 ? " · 通关！" : " · 再来一次");
  $("r-stars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
  $("r-stars").style.color = stars ? "var(--gold)" : "var(--dim)";
  $("r-rate").textContent = rate + "%";
  $("r-coin").textContent = "+" + run.gained;
  $("r-time").textContent = Math.floor(sec/60) + ":" + ("0" + (sec%60)).slice(-2);
  $("r-say").textContent = stars === 3 ? "漂亮！这一关的单词怪全被你收服了。"
    : stars === 2 ? "不错嘛，再来一次就满分了。"
    : stars === 1 ? "过关了！错的那几个我帮你记下来了。"
    : "差一点点～ 先去错题本热个身吧。";
  $("r-wrong").textContent = run.wrongIds.length
    ? "本次错了 " + run.wrongIds.length + " 个词，已放进错题本"
    : "全对！一个错词都没有 🎉";
  $("btn-again").textContent = run.level > 0 ? "再来一关（换 10 个词）" : "再练一次";
  show("result");
}

/* ============ 错题本 ============ */
function renderMistake(){
  $("m-count").textContent = "错题 " + save.mistakes.length;
  var box = $("m-list");
  if(!save.mistakes.length){
    box.innerHTML = '<div class="center dim">还没有错题，去闯关吧 👊</div>';
    $("btn-practice-all").style.display = "none";
    return;
  }
  $("btn-practice-all").style.display = "block";
  box.innerHTML = "";
  save.mistakes.slice(0,30).forEach(function(m){
    var w = WORDS.filter(function(x){ return x.id === m.wordId; })[0];
    if(!w) return;
    var d = document.createElement("div");
    d.className = "mw";
    d.innerHTML = '<div class="l"><b>' + w.en + ' <span class="dim tiny">' + w.phonetic + '</span></b>' +
                  '<span>' + w.zh + '</span></div>' +
                  '<div class="r">' + (m.wrongCount > 1 ? '<span class="chip">错 ' + m.wrongCount + ' 次</span>' : '') +
                  '<button class="btn sm ghost">练</button>' +
                  '<button class="btn sm ghost">🔊</button></div>';
    var bs = d.querySelectorAll("button");
    bs[0].onclick = function(){ SFX.tap(); startCustom([w], "单练 · " + w.en); };
    bs[1].onclick = function(){ speak(w.en); };
    box.appendChild(d);
  });
}

/* ============ 设置 ============ */
function renderSet(){
  $("btn-sfx").textContent = save.settings.sfx ? "🔊 开" : "🔇 关";
  $("btn-rate").textContent = (save.settings.ttsRate === 1 ? "正常" : "慢速") + " " + save.settings.ttsRate + "x";
}

/* ============ 事件绑定 ============ */
$("btn-start").onclick = function(){ ensureAudio(); SFX.tap(); renderMap(); show("map"); };
$("btn-go-mistake").onclick = function(){ renderMistake(); show("mistake"); };
$("btn-go-set").onclick = function(){ renderSet(); show("set"); };
$("btn-mistake").onclick = $("btn-mistake2").onclick = function(){ SFX.tap(); renderMistake(); show("mistake"); };
$("btn-set").onclick = function(){ renderSet(); show("set"); };
$("btn-npc").onclick = function(){ alert("口语镇还在建造中 🏗️\n预计 11 月中旬开放：可以跟 NPC 用英语随便聊，不会打分。"); };
$("btn-quit").onclick = function(){
  if(confirm("退出本关？已答的题会记进错题本，但本关进度不保留。")){ renderMap(); show("map"); }
};
$("btn-again").onclick = function(){
  if(run && run.level > 0) startLevel(run.level);
  else if(run) startCustom(save.mistakes.map(function(m){
    return WORDS.filter(function(w){ return w.id === m.wordId; })[0];
  }).filter(Boolean), "错题重练");
};
$("btn-back-map").onclick = function(){ renderMap(); show("map"); };
$("btn-back1").onclick = function(){ renderMap(); show("map"); };
$("btn-back2").onclick = function(){ renderMap(); show("map"); };
$("btn-practice-all").onclick = function(){
  SFX.tap();
  startCustom(save.mistakes.map(function(m){
    return WORDS.filter(function(w){ return w.id === m.wordId; })[0];
  }).filter(Boolean), "错题重练");
};
$("btn-sfx").onclick = function(){ save.settings.sfx = !save.settings.sfx; Store.save(); renderSet(); if(save.settings.sfx) SFX.tap(); };
$("btn-rate").onclick = function(){
  save.settings.ttsRate = save.settings.ttsRate === 1 ? 0.8 : 1; Store.save(); renderSet(); speak("hello");
};
$("btn-clear").onclick = function(){
  if(confirm("确定清空全部进度？金币、星级、错题都会没有，无法恢复。")){
    Store.reset(); save = Store.load(); renderSet(); alert("已清空，回到最初的样子。"); show("home");
  }
};

/* 键盘（PC 端）：1-4 选项，Enter 确认 / 下一题，Esc 返回 */
document.addEventListener("keydown", function(e){
  var sc = (location.hash || "#home").slice(1);
  if(sc === "quiz"){
    if(e.key >= "1" && e.key <= "4"){
      var b = document.querySelectorAll("#opts .opt")[parseInt(e.key,10) - 1];
      if(b) b.click();
    }
    if(e.key === "Enter"){ var ok = $("ok"); if(ok) ok.click(); }
    if(e.key === "Escape"){ renderMap(); show("map"); }
  } else if(e.key === "Escape" && sc !== "home"){ renderMap(); show("map"); }
});

/* 首屏：按 hash 直达（方便快速验收） */
(function(){
  var h = (location.hash || "").slice(1);
  if(h === "map"){ renderMap(); show("map"); }
  else if(h === "mistake"){ renderMistake(); show("mistake"); }
  else if(h === "set"){ renderSet(); show("set"); }
})();

})();
</script>
